services:
  postgres:
    image: postgres:16-alpine
    container_name: dbaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-dbaas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbaas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dbaas-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dbaas.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # API FastAPI. Roda em network_mode: host de propósito — o provisionador cria
  # containers-irmãos (via o socket Docker montado) e publica cada banco em
  # 127.0.0.1 do HOST; com host networking o backend enxerga tanto o Postgres da
  # plataforma (localhost:5432) quanto as instâncias gerenciadas nesse loopback,
  # como quando rodado via uvicorn no host.
  #
  # ${PWD} monta o data/ do repo no MESMO caminho absoluto dentro do container:
  # os bind mounts de WAL/backup que o provisionador passa ao daemon precisam
  # existir de forma idêntica no host e no container. Rode o compose da raiz do repo.
  backend:
    build:
      context: ./backend
    container_name: dbaas-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: localhost
      BACKUP_DIR: ${PWD}/data/backups
    network_mode: host
    # Roda com o UID/GID do usuário do host (dono do ./data montado abaixo), para
    # que o provisionador consiga criar as subpastas de backup/WAL. HOST_UID/HOST_GID
    # vêm do .env (`id -u` / `id -g`); default 1000:1000 cobre o caso single-user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # group_add dá acesso ao socket do Docker (necessário para provisionar
    # containers-irmãos). DOCKER_GID = gid do grupo `docker` no host
    # (`getent group docker`); varia por máquina, então fica no .env.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/data:${PWD}/data
    depends_on:
      postgres:
        condition: service_healthy
    # Após as migrations, semeia a frota de demonstração (3 empresas × prod/staging)
    # em background — provisiona containers reais quando há Docker, senão cai para
    # dados-apenas. Também grava o lastro de storage e semeia o histórico (frota
    # viva no 1º login). É idempotente, então religar o stack não recria nada. A
    # API sobe imediatamente; a frota, já populada, aparece no dashboard em ~2-4
    # min no primeiro boot (depois é instantâneo).
    command: >
      sh -c "alembic upgrade head &&
             { (python -m src.seed.demo || true) &
               uvicorn src.main:app --host 0.0.0.0 --port 8001; }"

  # Dashboard Next.js (build standalone). NEXT_PUBLIC_API_URL é baked no build —
  # o navegador (no host) fala com o backend em localhost:8001.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    container_name: dbaas-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
