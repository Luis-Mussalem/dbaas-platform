services:
  postgres:
    image: postgres:16-alpine
    container_name: dbaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-dbaas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbaas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dbaas-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dbaas.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI API. Runs with network_mode: host on purpose — the provisioner creates
  # sibling containers (via the mounted Docker socket) and publishes each database on
  # the HOST's 127.0.0.1; with host networking the backend sees both the platform's
  # Postgres (localhost:5432) and the managed instances on that same loopback,
  # just like when run via uvicorn on the host.
  #
  # ${PWD} mounts the repo's data/ at the SAME absolute path inside the container:
  # the WAL/backup bind mounts the provisioner passes to the daemon need to
  # exist identically on the host and in the container. Run compose from the repo root.
  backend:
    build:
      context: ./backend
    container_name: dbaas-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: localhost
      BACKUP_DIR: ${PWD}/data/backups
    network_mode: host
    # Runs with the host user's UID/GID (owner of the ./data mounted below), so
    # the provisioner can create the backup/WAL subfolders. HOST_UID/HOST_GID
    # come from .env (`id -u` / `id -g`); default 1000:1000 covers the single-user case.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # group_add grants access to the Docker socket (needed to provision
    # sibling containers). DOCKER_GID = gid of the `docker` group on the host
    # (`getent group docker`); varies by machine, so it lives in .env.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/data:${PWD}/data
    depends_on:
      postgres:
        condition: service_healthy
    # After migrations, seeds the demo fleet (3 companies × prod/staging)
    # in the background — provisions real containers when Docker is available, otherwise
    # falls back to data-only. Also writes the storage ballast and seeds the history (fleet
    # alive on 1st login). It's idempotent, so restarting the stack recreates nothing. The
    # API comes up immediately; the fleet, already populated, appears on the dashboard in ~2-4
    # min on first boot (instant after that).
    command: >
      sh -c "alembic upgrade head &&
             { (python -m src.seed.demo || true) &
               uvicorn src.main:app --host 0.0.0.0 --port 8001; }"

  # Next.js dashboard (standalone build). NEXT_PUBLIC_API_URL is baked into the build —
  # the browser (on the host) talks to the backend at localhost:8001.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
        NEXT_PUBLIC_DEMO_MODE: "true"
    container_name: dbaas-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
