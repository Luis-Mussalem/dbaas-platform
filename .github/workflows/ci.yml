name: CI

# Runs on pushes to main and on any Pull Request.
on:
  push:
    branches: [main]
  pull_request:

# Cancels stale runs of the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint (ruff) + tests (pytest) against a real PostgreSQL.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    # PostgreSQL as a service container — mirrors the local docker-compose.
    # The suite connects to it to create the dbaas_test test database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbaas
          # Ephemeral password for the CI service container (not a real secret).
          # config.py rejects "change-me" placeholders at startup.
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: dbaas
        ports:
          - 5432:5432
        # Waits for Postgres to accept connections before running the steps.
        options: >-
          --health-cmd "pg_isready -U dbaas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Connection to the service container (config.py uses these names).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: dbaas
      POSTGRES_PASSWORD: ci-only-test-password
      # The other sensitive variables (JWT_SECRET_KEY, FERNET_KEY,
      # PROVISIONER_SUPERUSER_PASSWORD, POSTGRES_DB) are set by
      # conftest.py itself before the application is imported.

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Frontend: message parity + lint (eslint) + typecheck (tsc) + build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (i18n + lint + typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Before the typecheck: a key drift produces a generic, hard-to-read tsc
      # error; this step names the missing key.
      - name: Check i18n messages (en/pt parity)
        run: npm run i18n:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: validates that the backend's multi-stage image builds without error.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: dbaas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
